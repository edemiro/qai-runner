<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="qai" x1="2" y1="0" x2="30" y2="32" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5b8def"/>
      <stop offset="1" stop-color="#b06fe6"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="9" fill="url(#qai)"/>
  <!-- The Q of QA, whose tail is the verdict mark: one shape says both. -->
  <circle cx="15" cy="15.2" r="7.4" fill="none" stroke="#fff" stroke-width="3.1"/>
  <!-- Punched in the badge colour first, so the tick reads as leaving the ring
       rather than lying across it. -->
  <path d="M13.7 16.7l3.6 3.7 7.6-8" fill="none" stroke="url(#qai)" stroke-width="7"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M13.7 16.7l3.6 3.7 7.6-8" fill="none" stroke="#fff" stroke-width="3.4"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
